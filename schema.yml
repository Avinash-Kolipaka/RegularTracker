openapi: 3.0.3
info:
  title: RegulaTrack Compliance API
  version: 1.0.0
  description: Complete API documentation for RegulaTrack regulatory intelligence
    & compliance operations platform.
paths:
  /api/v1/audit/businesses/{business_id}/:
    get:
      operationId: v1_audit_businesses_retrieve
      description: Retrieve audit activity events for a workspace.
      parameters:
      - in: path
        name: business_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: Retrieve or update currently authenticated user profile and workspaces.
      tags:
