services:
  # Backend API Web Service
  - type: web
    name: regulatrack-backend
    env: python
    rootDir: backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_ALL_HOSTS
        value: "True"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: regulatrack-postgres
          property: connectionString

  # Frontend Static Site
  - type: web
    name: regulatrack-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: regulatrack-backend
          envVarKey: RENDER_EXTERNAL_URL
          property: host

databases:
  - name: regulatrack-postgres
    databaseName: regulatrack
    user: regulatrack_admin
    plan: free
